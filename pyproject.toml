[project]
name = "footprint"
version = "0.1.0"
description = "OSINT-basierter Selbst-Audit / Digital-Footprint-Assessment (Skelett)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.ruff]
line-length = 100
